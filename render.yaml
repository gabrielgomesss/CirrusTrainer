services:
  - type: web
    name: cirrus-trainer
    runtime: static
    buildCommand: echo "Static PWA - no build required"
    staticPublishPath: .
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
